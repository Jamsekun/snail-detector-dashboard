<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snail Detector Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen">
        <div class="loader"></div>
        <p>Initializing Snail Detector...</p>
    </div>

    <!-- MAIN UI -->
    <div id="app" class="hidden">

        <header>
            <h1>🐌 Snail Detector Dashboard</h1>
            <p class="subtitle">Real-time YOLO detection • Raspberry Pi</p>
        </header>

        <main>

            <div class="grid">

                <!-- VIDEO STREAM -->
                <div class="card video-card">
                    <h2>Live Stream</h2>
                    <img id="video-feed" src="/video_feed" alt="Video stream">
                </div>

                <!-- COUNTER -->
                <div class="card counter-card">
                    <h2>Snail Count</h2>
                    <p id="snail-count" class="count">0</p>
                </div>

            </div>

            <!-- STATISTICS DROPDOWN -->
            <div class="card stats-card">
                <div class="stats-header" id="stats-header">
                    <h2>📊 Statistics</h2>
                    <button class="stats-toggle" id="stats-toggle" aria-label="Toggle statistics">
                        <span class="toggle-icon">▼</span>
                    </button>
                </div>
                
                <div class="stats-content" id="stats-content">
                    <!-- Current values (always visible) -->
                    <div class="stats-current">
                        <div class="stat-item">
                            <span class="stat-label">Total Snails:</span>
                            <span class="stat-value" id="stat-total">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Live Snails:</span>
                            <span class="stat-value" id="stat-live">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Inference FPS:</span>
                            <span class="stat-value" id="stat-inf-fps">0.0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Stream FPS:</span>
                            <span class="stat-value" id="stat-str-fps">0.0</span>
                        </div>
                    </div>

                    <!-- Charts (visible when expanded) -->
                    <div class="stats-charts" id="stats-charts">
                        <div class="chart-container">
                            <canvas id="countChart"></canvas>
                        </div>
                        <div class="chart-container">
                            <canvas id="fpsChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

        </main>

        <footer>
            <p>© 2025 Snail Detector • Raspberry Pi 5</p>
        </footer>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
